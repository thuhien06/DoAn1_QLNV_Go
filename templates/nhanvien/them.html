<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thêm nhân viên</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <h1>THÊM NHÂN VIÊN</h1>

    <form action="/nhanvien/them" method="POST">

        <p>
            <label>Mã nhân viên:</label><br>
            <input type="text" name="ma_nv" required>
        </p>

        <p>
            <label>Họ tên:</label><br>
            <input type="text" name="ho_ten" required>
        </p>

        <p>
            <label>Ngày sinh:</label><br>
            <input type="date" name="ngay_sinh">
        </p>

        <p>
            <label>Giới tính:</label><br>
            <select name="gioi_tinh">
                <option value="">-- Chọn giới tính --</option>
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
            </select>
        </p>

        <p>
            <label>Số điện thoại:</label><br>
            <input type="text" name="so_dien_thoai">
        </p>

        <p>
            <label>Email:</label><br>
            <input type="email" name="email">
        </p>

        <p>
            <label>Địa chỉ:</label><br>
            <input type="text" name="dia_chi">
        </p>

        <p>
            <label>Ngày vào làm:</label><br>
            <input type="date" name="ngay_vao_lam">
        </p>

        <p>
            <label>Phòng ban:</label><br>
            <input type="text" name="phong_ban">
        </p>

        <p>
            <label>Chức vụ:</label><br>
            <input type="text" name="chuc_vu">
        </p>

        <button type="submit">Thêm nhân viên</button>

        <a href="/nhanvien">Quay lại</a>

    </form>

</body>

</html>
