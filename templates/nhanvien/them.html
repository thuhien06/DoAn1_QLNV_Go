<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thêm nhân viên</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="employee-form-page">

        <h1>THÊM NHÂN VIÊN</h1>

        <form action="/nhanvien/them" method="POST" class="employee-form">

            <div class="form-group">
                <label>Mã nhân viên:</label>
                <input type="text" name="ma_nv" required>
            </div>

            <div class="form-group">
                <label>Họ tên:</label>
                <input type="text" name="ho_ten" required>
            </div>

            <div class="form-group">
                <label>Ngày sinh:</label>
                <input type="date" name="ngay_sinh">
            </div>

            <div class="form-group">
                <label>Giới tính:</label>
                <select name="gioi_tinh">
                    <option value="">-- Chọn giới tính --</option>
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                </select>
            </div>

            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="text" name="so_dien_thoai">
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email">
            </div>

            <div class="form-group">
                <label>Địa chỉ:</label>
                <input type="text" name="dia_chi">
            </div>

            <div class="form-group">
                <label>Ngày vào làm:</label>
                <input type="date" name="ngay_vao_lam">
            </div>

            <div class="form-group">
                <label>Phòng ban:</label>
                <input type="text" name="phong_ban">
            </div>

            <div class="form-group">
                <label>Chức vụ:</label>
                <input type="text" name="chuc_vu">
            </div>

            <div class="form-actions">

                <button type="submit" class="btn-save">
                    Thêm nhân viên
                </button>

                <a href="/nhanvien" class="btn-back">
                    Quay lại
                </a>

                <a href="/" class="btn-home">
                    Trang chủ
                </a>

            </div>

        </form>

    </div>

</body>

</html>
