<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách nhân viên</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <h1>Danh sách nhân viên</h1>

    <a href="/nhanvien/them">Thêm nhân viên</a>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Mã NV</th>
                <th>Họ tên</th>
                <th>Ngày sinh</th>
                <th>Giới tính</th>
                <th>Số điện thoại</th>
                <th>Email</th>
                <th>Địa chỉ</th>
                <th>Ngày vào làm</th>
                <th>Phòng ban</th>
                <th>Chức vụ</th>
            </tr>
        </thead>

        <tbody>
            {{range .}}
            <tr>
                <td>{{.ID}}</td>
                <td>{{.MaNV}}</td>
                <td>{{.HoTen}}</td>
                <td>{{.NgaySinh}}</td>
                <td>{{.GioiTinh}}</td>
                <td>{{.SoDienThoai}}</td>
                <td>{{.Email}}</td>
                <td>{{.DiaChi}}</td>
                <td>{{.NgayVaoLam}}</td>
                <td>{{.PhongBan}}</td>
                <td>{{.ChucVu}}</td>
            </tr>
            {{end}}
        </tbody>
    </table>

</body>
</html>
