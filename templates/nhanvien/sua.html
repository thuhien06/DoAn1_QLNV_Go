<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Sửa nhân viên</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

    <h1>SỬA THÔNG TIN NHÂN VIÊN</h1>

    <form action="/nhanvien/sua?id={{.ID}}" method="POST">

        <p>
            <label>Mã nhân viên:</label><br>
            <input
                type="text"
                name="ma_nv"
                value="{{.MaNV}}"
                required
            >
        </p>

        <p>
            <label>Họ tên:</label><br>
            <input
                type="text"
                name="ho_ten"
                value="{{.HoTen}}"
                required
            >
        </p>

        <p>
            <label>Ngày sinh:</label><br>
            <input
                type="date"
                name="ngay_sinh"
                value="{{if .NgaySinh}}{{.NgaySinh.Format "2006-01-02"}}{{end}}"
            >
        </p>

        <p>
            <label>Giới tính:</label><br>

            <select name="gioi_tinh">

                <option value="Nam"
                    {{if eq .GioiTinh "Nam"}}selected{{end}}>
                    Nam
                </option>

                <option value="Nữ"
                    {{if eq .GioiTinh "Nữ"}}selected{{end}}>
                    Nữ
                </option>

            </select>

        </p>

        <p>
            <label>Số điện thoại:</label><br>
            <input
                type="text"
                name="so_dien_thoai"
                value="{{.SoDienThoai}}"
            >
        </p>

        <p>
            <label>Email:</label><br>
            <input
                type="email"
                name="email"
                value="{{.Email}}"
            >
        </p>

        <p>
            <label>Địa chỉ:</label><br>
            <input
                type="text"
                name="dia_chi"
                value="{{.DiaChi}}"
            >
        </p>

        <p>
            <label>Ngày vào làm:</label><br>
            <input
                type="date"
                name="ngay_vao_lam"
                value="{{if .NgayVaoLam}}{{.NgayVaoLam.Format "2006-01-02"}}{{end}}"
            >
        </p>

        <p>
            <label>Phòng ban:</label><br>
            <input
                type="text"
                name="phong_ban"
                value="{{.PhongBan}}"
            >
        </p>

        <p>
            <label>Chức vụ:</label><br>
            <input
                type="text"
                name="chuc_vu"
                value="{{.ChucVu}}"
            >
        </p>

        <button type="submit">
            Lưu thay đổi
        </button>

        <a href="/nhanvien">
            Quay lại
        </a>

    </form>

</body>

</html>
