<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Sửa nhân viên</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>SỬA THÔNG TIN NHÂN VIÊN</h1>

    <form method="POST">

        <label>Mã nhân viên:</label>
        <input type="text"
               name="ma_nv"
               value="{{ nhan_vien.ma_nv }}"
               required>

        <br><br>

        <label>Họ tên:</label>
        <input type="text"
               name="ho_ten"
               value="{{ nhan_vien.ho_ten }}"
               required>

        <br><br>

        <label>Ngày sinh:</label>
        <input type="date"
               name="ngay_sinh"
               value="{{ nhan_vien.ngay_sinh }}">

        <br><br>

        <label>Giới tính:</label>
        <select name="gioi_tinh">

            <option value="Nam"
                {% if nhan_vien.gioi_tinh == "Nam" %}selected{% endif %}>
                Nam
            </option>

            <option value="Nữ"
                {% if nhan_vien.gioi_tinh == "Nữ" %}selected{% endif %}>
                Nữ
            </option>

        </select>

        <br><br>

        <label>Số điện thoại:</label>
        <input type="text"
               name="so_dien_thoai"
               value="{{ nhan_vien.so_dien_thoai or '' }}">

        <br><br>

        <label>Email:</label>
        <input type="email"
               name="email"
               value="{{ nhan_vien.email or '' }}">

        <br><br>

        <label>Địa chỉ:</label>
        <input type="text"
               name="dia_chi"
               value="{{ nhan_vien.dia_chi or '' }}">

        <br><br>

        <label>Ngày vào làm:</label>
        <input type="date"
               name="ngay_vao_lam"
               value="{{ nhan_vien.ngay_vao_lam }}">

        <br><br>

        <label>Phòng ban:</label>
        <input type="text"
               name="phong_ban"
               value="{{ nhan_vien.phong_ban or '' }}">

        <br><br>

        <label>Chức vụ:</label>
        <input type="text"
               name="chuc_vu"
               value="{{ nhan_vien.chuc_vu or '' }}">

        <br><br>

        <button type="submit">
            Lưu thay đổi
        </button>

        <a href="{{ url_for('nhanvien.danh_sach_nhan_vien') }}">
            Quay lại
        </a>

    </form>

</div>

</body>

</html>
