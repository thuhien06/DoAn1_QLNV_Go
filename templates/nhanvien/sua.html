<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Sửa nhân viên</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="employee-form-page">

        <h1>SỬA THÔNG TIN NHÂN VIÊN</h1>

        <form
            action="/nhanvien/sua?id={{.ID}}"
            method="POST"
            class="employee-form"
        >

            <div class="form-group">
                <label>Mã nhân viên:</label>
                <input
                    type="text"
                    name="ma_nv"
                    value="{{.MaNV}}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Họ tên:</label>
                <input
                    type="text"
                    name="ho_ten"
                    value="{{.HoTen}}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Ngày sinh:</label>
                <input
                    type="date"
                    name="ngay_sinh"
                    value="{{if .NgaySinh}}{{.NgaySinh.Format "2006-01-02"}}{{end}}"
                >
            </div>

            <div class="form-group">
                <label>Giới tính:</label>

                <select name="gioi_tinh">

                    <option value="Nam"
                        {{if eq .GioiTinh "Nam"}}selected{{end}}>
                        Nam
                    </option>

                    <option value="Nữ"
                        {{if eq .GioiTinh "Nữ"}}selected{{end}}>
                        Nữ
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label>Số điện thoại:</label>
                <input
                    type="text"
                    name="so_dien_thoai"
                    value="{{.SoDienThoai}}"
                >
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input
                    type="email"
                    name="email"
                    value="{{.Email}}"
                >
            </div>

            <div class="form-group">
                <label>Địa chỉ:</label>
                <input
                    type="text"
                    name="dia_chi"
                    value="{{.DiaChi}}"
                >
            </div>

            <div class="form-group">
                <label>Ngày vào làm:</label>
                <input
                    type="date"
                    name="ngay_vao_lam"
                    value="{{if .NgayVaoLam}}{{.NgayVaoLam.Format "2006-01-02"}}{{end}}"
                >
            </div>

            <div class="form-group">
                <label>Phòng ban:</label>
                <input
                    type="text"
                    name="phong_ban"
                    value="{{.PhongBan}}"
                >
            </div>

            <div class="form-group">
                <label>Chức vụ:</label>
                <input
                    type="text"
                    name="chuc_vu"
                    value="{{.ChucVu}}"
                >
            </div>

            <div class="form-actions">

                <button type="submit" class="btn-save">
                    Lưu thay đổi
                </button>

                <a href="/nhanvien" class="btn-back">
                    Quay lại
                </a>

                <a href="/" class="btn-home">
                    Trang chủ
                </a>

            </div>

        </form>

    </div>

</body>
</html>
