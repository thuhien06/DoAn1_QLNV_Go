<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Sửa bảng lương</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="payroll-form-page">

        <h1>SỬA BẢNG LƯƠNG</h1>

        <form action="/bangluong/sua?id={{.ID}}" method="POST" class="payroll-form">

            <div class="form-group">
                <label for="ma_nv">Mã nhân viên:</label>
                <input type="text"
                       id="ma_nv"
                       name="ma_nv"
                       value="{{.MaNV}}"
                       required>
            </div>

            <div class="form-group">
                <label for="thang">Tháng:</label>
                <input type="number"
                       id="thang"
                       name="thang"
                       min="1"
                       max="12"
                       value="{{.Thang}}"
                       required>
            </div>

            <div class="form-group">
                <label for="nam">Năm:</label>
                <input type="number"
                       id="nam"
                       name="nam"
                       min="2000"
                       value="{{.Nam}}"
                       required>
            </div>

            <div class="form-group">
                <label for="so_ngay_cong">Số ngày công:</label>
                <input type="number"
                       id="so_ngay_cong"
                       name="so_ngay_cong"
                       min="0"
                       value="{{.SoNgayCong}}"
                       required>
            </div>

            <div class="form-group">
                <label for="phu_cap">Phụ cấp:</label>
                <input type="number"
                       id="phu_cap"
                       name="phu_cap"
                       min="0"
                       step="0.01"
                       value="{{printf "%.0f" .PhuCap}}">
            </div>

            <div class="form-group">
                <label for="khau_tru">Khấu trừ:</label>
                <input type="number"
                       id="khau_tru"
                       name="khau_tru"
                       min="0"
                       step="0.01"
                       value="{{.KhauTru}}">
            </div>

            <div class="form-group">
                <label for="ghi_chu">Ghi chú:</label>
                <input type="text"
                       id="ghi_chu"
                       name="ghi_chu"
                       value="{{printf "%.0f" .GhiChu}}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">
                    Cập nhật
                </button>

                <a href="/bangluong" class="btn-back">
                    Quay lại
                </a>

                <a href="/" class="btn-home">
                    Trang chủ
                </a>
            </div>

        </form>

    </div>
</body>

</html>
