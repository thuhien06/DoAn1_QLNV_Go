<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thêm bảng lương</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="payroll-form-page">

        <h1>THÊM BẢNG LƯƠNG</h1>

        {{if .Error}}
            <p class="payroll-form-error">{{.Error}}</p>
        {{end}}

        <form action="/bangluong/them" method="POST" class="payroll-form">

            <div class="form-group">
                <label for="ma_nv">Mã nhân viên:</label>
                <input type="text"
                       id="ma_nv"
                       name="ma_nv"
                       placeholder="Nhập mã nhân viên"
                       required>
            </div>

            <div class="form-group">
                <label for="thang">Tháng:</label>
                <input type="number"
                       id="thang"
                       name="thang"
                       min="1"
                       max="12"
                       value="{{.Thang}}"
                       required>
            </div>

            <div class="form-group">
                <label for="nam">Năm:</label>
                <input type="number"
                       id="nam"
                       name="nam"
                       min="2000"
                       value="{{.Nam}}"
                       required>
            </div>

            <div class="form-group">
                <label for="phu_cap">Thưởng:</label>
                <input type="number"
                       id="phu_cap"
                       name="phu_cap"
                       min="0"
                       step="0.01"
                       value="0">
            </div>

            <div class="form-group">
                <label for="khau_tru">Khấu trừ:</label>
                <input type="number"
                       id="khau_tru"
                       name="khau_tru"
                       min="0"
                       step="0.01"
                       value="0">
            </div>

            <div class="form-group">
                <label for="ghi_chu">Ghi chú:</label>
                <input type="text"
                       id="ghi_chu"
                       name="ghi_chu">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">
                    Xem trước và lưu
                </button>

                <a href="/bangluong" class="btn-back">
                    Quay lại
                </a>

                <a href="/" class="btn-home">
                    Trang chủ
                </a>
            </div>

        </form>

    </div>
</body>

</html>
