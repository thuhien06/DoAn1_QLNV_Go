<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm bảng lương</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <h1>Thêm bảng lương</h1>

    {{if .Error}}
        <p style="color: red;">{{.Error}}</p>
    {{end}}

    <a href="/bangluong">Danh sách bảng lương</a>

    <br><br>

    <form action="/bangluong/them" method="POST">

        <label>Mã nhân viên:</label>
        <br>
        <input type="text" name="ma_nv" placeholder="Nhập mã nhân viên" required>

        <br><br>

        <label>Tháng:</label>
        <br>
        <input type="number"
            name="thang"
            min="1"
            max="12"
            value="{{.Thang}}"
            required>

        <br><br>

        <label>Năm:</label>
        <br>
        <input type="number"
            name="nam"
            min="2000"
            value="{{.Nam}}"
            required>

        <br><br>

        <label>Thưởng:</label>
        <br>
        <input type="number"
            name="phu_cap"
            min="0"
            step="0.01"
            value="0">

        <br><br>

        <label>Khấu trừ:</label>
        <br>
        <input type="number"
            name="khau_tru"
            min="0"
            step="0.01"
            value="0">

        <br><br>

        <label>Ghi chú:</label>
        <br>
        <input type="text" name="ghi_chu">

        <br><br>

        <button type="submit">Xem trước và lưu</button>

    </form>

</body>
</html>
