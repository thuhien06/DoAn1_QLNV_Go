<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm bảng lương</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <h1>Thêm bảng lương</h1>

    {{if .Error}}
        <p style="color: red;">{{.Error}}</p>
    {{end}}

    <a href="/bangluong">Danh sách bảng lương</a>

    <br><br>

    <form action="/bangluong/them" method="POST">

        <label>Mã nhân viên:</label>
        <br>
        <input type="text" name="ma_nv" required>

        <br><br>

        <label>Tháng:</label>
        <br>
        <input type="number" name="thang" min="1" max="12" required>

        <br><br>

        <label>Năm:</label>
        <br>
        <input type="number" name="nam" min="2000" required>

        <br><br>

        <label>Lương cơ bản:</label>
        <br>
        <input type="number" name="luong_co_ban"
               min="0" step="0.01" required>

        <br><br>

        <label>Số ngày công:</label>
        <br>
        <input type="number" name="so_ngay_cong"
               min="0" required>

        <br><br>

        <label>Phụ cấp:</label>
        <br>
        <input type="number" name="phu_cap"
               min="0" step="0.01" value="0">

        <br><br>

        <label>Khấu trừ:</label>
        <br>
        <input type="number" name="khau_tru"
               min="0" step="0.01" value="0">

        <br><br>

        <label>Ghi chú:</label>
        <br>
        <input type="text" name="ghi_chu">

        <br><br>

        <button type="submit">Lưu</button>

    </form>

</body>
</html>
