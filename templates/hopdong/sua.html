<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Sửa hợp đồng</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="contract-form-page">

        <h1>SỬA HỢP ĐỒNG</h1>

        <form
            action="/hopdong/sua?id={{.ID}}"
            method="POST"
            class="contract-form"
        >

            <div class="form-group">
                <label>Mã hợp đồng:</label>
                <input
                    type="text"
                    name="ma_hd"
                    value="{{.MaHD}}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Mã nhân viên phụ trách:</label>
                <input
                    type="text"
                    name="ma_nv"
                    value="{{.MaNV}}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Nhóm hợp đồng:</label>

                <select
                    name="nhom_hop_dong"
                    id="nhom_hop_dong"
                    onchange="hienThiForm()"
                    required
                >
                    <option value="lao_dong"
                        {{if eq .NhomHopDong "lao_dong"}}selected{{end}}>
                        Lao động
                    </option>

                    <option value="kinh_doanh"
                        {{if eq .NhomHopDong "kinh_doanh"}}selected{{end}}>
                        Kinh doanh
                    </option>

                    <option value="van_hanh"
                        {{if eq .NhomHopDong "van_hanh"}}selected{{end}}>
                        Vận hành
                    </option>
                </select>
            </div>


            <!-- HỢP ĐỒNG LAO ĐỘNG -->
            <div id="formLaoDong">

                <h3>Thông tin hợp đồng lao động</h3>

                <div class="form-group">
                    <label>Loại hợp đồng lao động:</label>

                    <select name="loai_hop_dong">
                        <option value="Thử việc"
                            {{if eq .LoaiHopDong "Thử việc"}}selected{{end}}>
                            Thử việc
                        </option>

                        <option value="Xác định thời hạn"
                            {{if eq .LoaiHopDong "Xác định thời hạn"}}selected{{end}}>
                            Xác định thời hạn
                        </option>

                        <option value="Không xác định thời hạn"
                            {{if eq .LoaiHopDong "Không xác định thời hạn"}}selected{{end}}>
                            Không xác định thời hạn
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Lương cơ bản:</label>

                    <input
                        type="number"
                        name="luong_co_ban"
                        step="0.01"
                        min="0"
                        value="{{.LuongCoBan}}"
                    >
                </div>

            </div>


            <!-- HỢP ĐỒNG KINH DOANH -->
            <div id="formKinhDoanh">

                <h3>Thông tin hợp đồng kinh doanh</h3>

                <div class="form-group">
                    <label>Đối tác:</label>

                    <input
                        type="text"
                        name="doi_tac"
                        value="{{if .DoiTac}}{{.DoiTac}}{{end}}"
                    >
                </div>

                <div class="form-group">
                    <label>Người đại diện:</label>

                    <input
                        type="text"
                        name="nguoi_dai_dien"
                        value="{{if .NguoiDaiDien}}{{.NguoiDaiDien}}{{end}}"
                    >
                </div>

                <div class="form-group">
                    <label>Nội dung hợp đồng:</label>

                    <textarea name="noi_dung">{{if .NoiDung}}{{.NoiDung}}{{end}}</textarea>
                </div>

                <div class="form-group">
                    <label>Giá trị hợp đồng:</label>

                    <input
                        type="number"
                        name="gia_tri"
                        min="0"
                        step="0.01"
                        value="{{if .GiaTri}}{{printf "%.0f" (deref .GiaTri)}}{{end}}"
                    >
                </div>

                <div class="form-group">
                    <label>Ngày ký:</label>

                    <input
                        type="date"
                        name="ngay_ky"
                        value="{{if .NgayKy}}{{.NgayKy.Format "2006-01-02"}}{{end}}"
                    >
                </div>

            </div>


            <!-- HỢP ĐỒNG VẬN HÀNH -->
            <div id="formVanHanh">

                <h3>Thông tin hợp đồng vận hành</h3>

                <div class="form-group">
                    <label>Đối tác/Nhà cung cấp:</label>

                    <input
                        type="text"
                        name="doi_tac"
                        value="{{if .DoiTac}}{{.DoiTac}}{{end}}"
                    >
                </div>

                <div class="form-group">
                    <label>Dịch vụ/Thiết bị:</label>

                    <input
                        type="text"
                        name="dich_vu_thiet_bi"
                        value="{{if .DichVuThietBi}}{{.DichVuThietBi}}{{end}}"
                    >
                </div>

                <div class="form-group">
                    <label>Nội dung công việc:</label>

                    <textarea name="noi_dung">{{if .NoiDung}}{{.NoiDung}}{{end}}</textarea>
                </div>

                <div class="form-group">
                    <label>Chi phí:</label>

                    <input
                        type="number"
                        name="chi_phi"
                        min="0"
                        step="0.01"
                        value="{{if .ChiPhi}}{{printf "%.0f" (deref .ChiPhi)}}{{end}}"
                    >
                </div>

                <div class="form-group">
                    <label>Ngày ký:</label>

                    <input
                        type="date"
                        name="ngay_ky"
                        value="{{if .NgayKy}}{{.NgayKy.Format "2006-01-02"}}{{end}}"
                    >
                </div>

            </div>


            <!-- THÔNG TIN CHUNG -->
            <h3>Thông tin chung</h3>

            <div class="form-group">
                <label>Ngày bắt đầu:</label>

                <input
                    type="date"
                    name="ngay_bat_dau"
                    value="{{if .NgayBatDau}}{{.NgayBatDau.Format "2006-01-02"}}{{end}}"
                >
            </div>

            <div class="form-group">
                <label>Ngày kết thúc:</label>

                <input
                    type="date"
                    name="ngay_ket_thuc"
                    value="{{if .NgayKetThuc}}{{.NgayKetThuc.Format "2006-01-02"}}{{end}}"
                >
            </div>

            <div class="form-group">
                <label>Ghi chú:</label>

                <textarea name="ghi_chu">{{.GhiChu}}</textarea>
            </div>


            <div class="form-actions">

                <button type="submit" class="btn-save">
                    Lưu thay đổi
                </button>

                <a href="/hopdong" class="btn-back">
                    Quay lại
                </a>

            </div>

        </form>

    </div>


    <script>
        function hienThiForm() {

            const nhom =
                document.getElementById("nhom_hop_dong").value;

            document.getElementById("formLaoDong").style.display =
                nhom === "lao_dong" ? "block" : "none";

            document.getElementById("formKinhDoanh").style.display =
                nhom === "kinh_doanh" ? "block" : "none";

            document.getElementById("formVanHanh").style.display =
                nhom === "van_hanh" ? "block" : "none";


            document.querySelectorAll(
                "#formLaoDong input, #formLaoDong select, #formLaoDong textarea"
            ).forEach(el =>
                el.disabled = nhom !== "lao_dong"
            );


            document.querySelectorAll(
                "#formKinhDoanh input, #formKinhDoanh select, #formKinhDoanh textarea"
            ).forEach(el =>
                el.disabled = nhom !== "kinh_doanh"
            );


            document.querySelectorAll(
                "#formVanHanh input, #formVanHanh select, #formVanHanh textarea"
            ).forEach(el =>
                el.disabled = nhom !== "van_hanh"
            );
        }

        hienThiForm();
    </script>

</body>
</html>
