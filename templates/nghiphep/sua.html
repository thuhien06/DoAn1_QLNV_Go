<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Sửa nghỉ phép</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="leave-form-page">

        <h1>SỬA ĐƠN NGHỈ PHÉP</h1>

        <form action="/nghiphep/sua?id={{.ID}}" method="POST" class="leave-form">

            <div class="form-group">
                <label for="ma_nv">Mã nhân viên:</label>
                <input type="text"
                       id="ma_nv"
                       name="ma_nv"
                       value="{{.MaNV}}"
                       required>
            </div>

            <div class="form-group">
                <label for="ngay_bat_dau">Ngày bắt đầu:</label>
                <input type="date"
                       id="ngay_bat_dau"
                       name="ngay_bat_dau"
                       value="{{if .NgayBatDau}}{{.NgayBatDau.Format "2006-01-02"}}{{end}}"
                       required>
            </div>

            <div class="form-group">
                <label for="ngay_ket_thuc">Ngày kết thúc:</label>
                <input type="date"
                       id="ngay_ket_thuc"
                       name="ngay_ket_thuc"
                       value="{{if .NgayKetThuc}}{{.NgayKetThuc.Format "2006-01-02"}}{{end}}"
                       required>
            </div>

            <div class="form-group">
                <label for="loai_nghi">Loại nghỉ:</label>
                <select id="loai_nghi" name="loai_nghi" required>
                    <option value="Nghỉ phép"
                        {{if eq .LoaiNghi "Nghỉ phép"}}selected{{end}}>
                        Nghỉ phép
                    </option>

                    <option value="Nghỉ ốm"
                        {{if eq .LoaiNghi "Nghỉ ốm"}}selected{{end}}>
                        Nghỉ ốm
                    </option>

                    <option value="Nghỉ việc riêng"
                        {{if eq .LoaiNghi "Nghỉ việc riêng"}}selected{{end}}>
                        Nghỉ việc riêng
                    </option>

                    <option value="Nghỉ không lương"
                        {{if eq .LoaiNghi "Nghỉ không lương"}}selected{{end}}>
                        Nghỉ không lương
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="ly_do">Lý do:</label>
                <input type="text"
                       id="ly_do"
                       name="ly_do"
                       value="{{.LyDo}}"
                       required>
            </div>

            <div class="form-group">
                <label for="trang_thai">Trạng thái:</label>
                <select id="trang_thai" name="trang_thai" required>
                    <option value="Chờ duyệt"
                        {{if eq .TrangThai "Chờ duyệt"}}selected{{end}}>
                        Chờ duyệt
                    </option>

                    <option value="Đã duyệt"
                        {{if eq .TrangThai "Đã duyệt"}}selected{{end}}>
                        Đã duyệt
                    </option>

                    <option value="Từ chối"
                        {{if eq .TrangThai "Từ chối"}}selected{{end}}>
                        Từ chối
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="ghi_chu">Ghi chú:</label>
                <input type="text"
                       id="ghi_chu"
                       name="ghi_chu"
                       value="{{.GhiChu}}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">Cập nhật</button>
                <a href="/nghiphep" class="btn-back">Quay lại</a>
                <a href="/" class="btn-home">Trang chủ</a>
            </div>

        </form>
    </div>
</body>

</html>
