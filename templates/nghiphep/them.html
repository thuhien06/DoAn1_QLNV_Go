<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký nghỉ phép</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <h1>Đăng ký nghỉ phép</h1>

    {{if .Error}}
        <p style="color: red;">{{.Error}}</p>
    {{end}}

    <a href="/nghiphep-ca-nhan">Đơn nghỉ phép của tôi</a>

    <br><br>

    <form action="/nghiphep/them" method="POST">
        <label>Ngày bắt đầu:</label>
        <br>
        <input type="date" name="ngay_bat_dau" required>
        <br><br>

        <label>Ngày kết thúc:</label>
        <br>
        <input type="date" name="ngay_ket_thuc" required>
        <br><br>

        <label>Loại nghỉ:</label>
        <br>
        <select name="loai_nghi" required>
            <option value="Nghỉ phép">Nghỉ phép</option>
            <option value="Nghỉ ốm">Nghỉ ốm</option>
            <option value="Nghỉ việc riêng">Nghỉ việc riêng</option>
            <option value="Nghỉ không lương">Nghỉ không lương</option>
        </select>
        <br><br>

        <label>Lý do:</label>
        <br>
        <input type="text" name="ly_do" required>
        <br><br>

        <label>Ghi chú:</label>
        <br>
        <textarea name="ghi_chu" rows="3"></textarea>
        <br><br>

        <p>Trạng thái đơn: <strong>Chờ duyệt</strong></p>

        <button type="submit">Gửi đơn nghỉ phép</button>
    </form>
</body>
</html>
