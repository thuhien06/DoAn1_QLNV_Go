<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thêm chấm công</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="attendance-form-page">

        <h1>THÊM CHẤM CÔNG</h1>

        {{if .Error}}
            <p class="attendance-form-error">{{.Error}}</p>
        {{end}}

        <form action="/chamcong/them" method="POST" class="attendance-form">

            <div class="form-group">
                <label>Mã nhân viên:</label>
                <input type="text" name="ma_nv" required>
            </div>

            <div class="form-group">
                <label>Ngày chấm công:</label>
                <input type="date" name="ngay_cham_cong" required>
            </div>

            <div class="form-group">
                <label>Giờ vào:</label>
                <input type="time" name="gio_vao">
            </div>

            <div class="form-group">
                <label>Giờ ra:</label>
                <input type="time" name="gio_ra">
            </div>

            <div class="form-group">
                <label>Trạng thái:</label>
                <select name="trang_thai">
                    <option value="">-- Chọn trạng thái --</option>
                    <option value="Có mặt">Có mặt</option>
                    <option value="Đi muộn">Đi muộn</option>
                    <option value="Về sớm">Về sớm</option>
                    <option value="Nghỉ">Nghỉ</option>
                </select>
            </div>

            <div class="form-group">
                <label>Ghi chú:</label>
                <input type="text" name="ghi_chu">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">
                    Thêm chấm công
                </button>

                <a href="/chamcong" class="btn-back">
                    Quay lại
                </a>

                <a href="/" class="btn-home">
                    Trang chủ
                </a>
            </div>

        </form>

    </div>

</body>
</html>
