<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Sửa chấm công</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="attendance-form-page">

        <h1>SỬA CHẤM CÔNG</h1>

        <form action="/chamcong/sua?id={{.ID}}" method="POST" class="attendance-form">

            <div class="form-group">
                <label>Mã nhân viên:</label>
                <input
                    type="text"
                    name="ma_nv"
                    value="{{.MaNV}}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Ngày chấm công:</label>
                <input
                    type="date"
                    name="ngay_cham_cong"
                    value="{{if .NgayChamCong}}{{.NgayChamCong.Format "2006-01-02"}}{{end}}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Giờ vào:</label>
                <input
                    type="time"
                    name="gio_vao"
                    value="{{.GioVao}}"
                >
            </div>

            <div class="form-group">
                <label>Giờ ra:</label>
                <input
                    type="time"
                    name="gio_ra"
                    value="{{.GioRa}}"
                >
            </div>

            <div class="form-group">
                <label>Trạng thái:</label>

                <select name="trang_thai">

                    <option value="Có mặt"
                        {{if eq .TrangThai "Có mặt"}}selected{{end}}>
                        Có mặt
                    </option>

                    <option value="Đi muộn"
                        {{if eq .TrangThai "Đi muộn"}}selected{{end}}>
                        Đi muộn
                    </option>

                    <option value="Về sớm"
                        {{if eq .TrangThai "Về sớm"}}selected{{end}}>
                        Về sớm
                    </option>

                    <option value="Nghỉ"
                        {{if eq .TrangThai "Nghỉ"}}selected{{end}}>
                        Nghỉ
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label>Ghi chú:</label>

                <input
                    type="text"
                    name="ghi_chu"
                    value="{{.GhiChu}}"
                >
            </div>

            <div class="form-actions">

                <button type="submit" class="btn-save">
                    Lưu thay đổi
                </button>

                <a href="/chamcong" class="btn-back">
                    Quay lại
                </a>

                <a href="/" class="btn-home">
                    Trang chủ
                </a>

            </div>

        </form>

    </div>

</body>
</html>
